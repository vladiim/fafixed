[project]
name = "fafixed"
version = "0.1.0"
description = "SaaS for financial accountants to clean Xero data with AI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "django>=5.0",
    "psycopg2-binary",
    "python-dotenv",
    "whitenoise",
    "django-extensions",
    "xero-python>=9.0.0",
    "django-encrypted-model-fields>=0.6.5",
    "cryptography>=45.0.6",
    "celery>=5.5.3",
    "redis>=5.0.0",
    "requests>=2.31.0",
    "pytest>=8.4.1",
    "django-turbo-helper>=2.1.4",
    "channels>=4.0.0",
    "channels-redis>=4.2.0",
    "daphne>=4.0.0",
    "django-actioncable>=1.0.4",
    "websockets>=15.0.1",
]
