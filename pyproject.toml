[project]
name = "veridy"
version = "0.1.0"
description = "SaaS for financial accountants to clean Xero data with AI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "django>=5.0",
    "psycopg2-binary",
    "python-dotenv",
    "whitenoise",
    "django-extensions",
    "xero-python>=9.0.0",
    "django-encrypted-model-fields>=0.6.5",
    "cryptography>=45.0.6",
    "celery>=5.5.3",
    "redis>=5.0.0",
    "requests>=2.31.0",
    "pytest>=8.4.1",
    "django-turbo-helper>=2.1.4",
    "channels>=4.0.0",
    "channels-redis>=4.2.0",
    "daphne>=4.0.0",
    "django-actioncable>=1.0.4",
    "websockets>=15.0.1",
]

[dependency-groups]
dev = [
    "pytest-django==4.7.0",
    "pytest-cov==4.0.0",
    "factory-boy==3.3.0", 
    "freezegun==1.2.2",
    "locust==2.17.0",
    "pytest-xdist==3.5.0",
]
