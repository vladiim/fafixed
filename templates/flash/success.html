<div class="w-full p-4 bg-green-500 text-white border-l-4 border-green-600 transition-all duration-300" 
     data-controller="message-alert" 
     data-message-alert-delay-value="5000">
    <div class="flex items-start">
        <div class="flex-shrink-0">
            <i class="fas fa-check-circle text-white"></i>
        </div>
        <div class="ml-3 flex-1">
            <p class="text-sm font-medium">{{ message }}</p>
        </div>
        <div class="ml-2 flex-shrink-0">
            <button type="button" 
                    class="inline-flex text-gray-200 hover:text-white focus:outline-none transition"
                    data-action="click->message-alert#dismiss">
                <i class="fas fa-times text-sm"></i>
            </button>
        </div>
    </div>
</div>
