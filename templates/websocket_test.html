<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Test</title>
    <script src="https://unpkg.com/@hotwired/turbo@8.0.4/dist/turbo.es2017-esm.js" type="module"></script>
</head>
<body>
    <h1>Simple WebSocket Test</h1>
    <p>Check browser console for WebSocket connection status</p>
    
    <turbo-stream-source 
        src="ws://localhost:8000/cable" 
        channel="TurboStreamCableChannel" 
        stream-name="transaction_updates_169">
    </turbo-stream-source>
    
    <turbo-frame id="test-frame">
        <div style="border: 2px solid red; padding: 20px; margin: 10px;">
            <h2>⏳ Waiting for WebSocket update...</h2>
            <p>If WebSocket works, this should change to "✅ Hello WebSocket!"</p>
            <p>Current time: <span id="timestamp">Loading...</span></p>
        </div>
    </turbo-frame>
    
    <button onclick="testUpdate()">Manual Test Update</button>
    
    <script>
        function testUpdate() {
            console.log('🧪 Testing manual update via fetch...')
            const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value
            console.log('🔐 CSRF token:', csrfToken ? 'Found' : 'Missing')
            
            fetch('/integrations/transactions/169/refresh-status/', {
                method: 'POST',
                headers: {
                    'X-CSRFToken': csrfToken,
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: 'csrfmiddlewaretoken=' + csrfToken
            }).then(response => {
                console.log('✅ Response:', response.status, response.statusText)
                return response.text()
            }).then(html => {
                console.log('📄 Response HTML preview:', html.substring(0, 200))
            }).catch(err => {
                console.error('❌ Error:', err)
            })
        }
        
        // Show current time
        setInterval(() => {
            document.getElementById('timestamp').textContent = new Date().toLocaleTimeString()
        }, 1000)
        
        // Log WebSocket events
        document.addEventListener('turbo:connect-stream-source', (event) => {
            console.log('🔌 SPIKE: WebSocket connected:', event.detail)
        })
        
        document.addEventListener('turbo:disconnect-stream-source', (event) => {
            console.log('❌ SPIKE: WebSocket disconnected:', event.detail)  
        })
        
        console.log('🚀 SPIKE: WebSocket test page loaded')
    </script>
    {% csrf_token %}
</body>
</html>
